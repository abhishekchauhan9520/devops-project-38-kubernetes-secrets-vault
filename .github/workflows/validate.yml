name: Validate Vault Kubernetes configuration

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install validation tools
        run: |
          python -m pip install --upgrade pip pyyaml
          curl -fsSL -o /tmp/helm.tar.gz https://get.helm.sh/helm-v4.2.4-linux-amd64.tar.gz
          tar -xzf /tmp/helm.tar.gz -C /tmp
          sudo mv /tmp/linux-amd64/helm /usr/local/bin/helm

      - name: Shell syntax
        run: bash -n scripts/bootstrap-vault.sh scripts/rotate-secret.sh tests/test_manifests.sh

      - name: Manifest assertions
        run: bash tests/test_manifests.sh

      - name: Helm repository lint
        run: helm lint --strict --set injector.enabled=true vault

      - name: YAML parse check
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml
          for path in Path('k8s').glob('*.yaml'):
              list(yaml.safe_load_all(path.read_text()))
          print('Kubernetes YAML parsed successfully')
          PY
